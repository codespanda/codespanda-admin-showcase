name: Bump portfolio view counts

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/bump-daily-views.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/lib/portfolio-data.ts; then
            echo "No changes — skipping commit."
            exit 0
          fi
          git add src/lib/portfolio-data.ts
          git commit -m "chore: daily portfolio view count bump"
          git push
